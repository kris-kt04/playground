services:
  devpod:
    build:
      context: .
      dockerfile: dev-env.dockerfile
    volumes:
      - ..:/workspace
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    command: ["sleep", "infinity"]
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saas
    ports:
      - "5432:5432"
